<!doctype html><meta charset="utf-8"><title>ref sheet</title>
<style>body{margin:0;background:#111;color:#fff;font:11px monospace}
#g{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:2px}
figure{margin:0;position:relative}figcaption{position:absolute;left:2px;top:2px;background:#000c;padding:1px 3px}
canvas{width:100%;display:block}#meta{padding:4px}</style>
<div id="meta">loading…</div><div id="g"></div>
<script>
const params = new URLSearchParams(location.search);
const start = parseFloat(params.get('start') || '0');
const end = parseFloat(params.get('end') || '0');
const n = parseInt(params.get('n') || '12', 10);
const w = parseInt(params.get('w') || '320', 10);
const cols = params.get('cols') || '4';
const crop = params.get('crop') ? params.get('crop').split(',').map(Number) : null;
document.getElementById('g').style.setProperty('--cols', cols);
const v = document.createElement('video');
v.src = 'ref.mp4'; v.muted = true; v.preload = 'auto';
v.addEventListener('loadedmetadata', async () => {
  const dur = v.duration;
  const hi = end > 0 ? end : dur;
  document.getElementById('meta').textContent =
    `duration=${dur.toFixed(2)}s video=${v.videoWidth}x${v.videoHeight} window=${start.toFixed(2)}-${hi.toFixed(2)} n=${n}`;
  const h = Math.round(w * v.videoHeight / v.videoWidth);
  for (let i = 0; i < n; i++) {
    const t = start + (hi - start) * (n === 1 ? 0 : i / (n - 1));
    await new Promise((res) => { v.onseeked = res; v.currentTime = Math.min(t, dur - 0.001); });
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');
    if (crop) { const [sx,sy,sw] = crop; ctx.drawImage(v, sx, sy, sw, Math.round(sw*h/w), 0, 0, w, h); }
    else ctx.drawImage(v, 0, 0, w, h);
    const fig = document.createElement('figure');
    const cap = document.createElement('figcaption'); cap.textContent = t.toFixed(2) + 's';
    fig.append(c, cap); document.getElementById('g').append(fig);
  }
  document.title = 'ready';
});
</script>
