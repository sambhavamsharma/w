<!doctype html>
<meta charset="utf-8">
<title>measure</title>
<pre id="out">measuring</pre>
<script>
const v = document.createElement('video');
v.src = 'ref.mp4';
v.muted = true;
v.preload = 'auto';
const seek = (t) => new Promise((r) => { v.onseeked = r; v.currentTime = t; });

v.addEventListener('loadedmetadata', async () => {
  const W = v.videoWidth, H = v.videoHeight;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  const out = [];
  const lum = (d, x, y) => { const i = (y * W + x) * 4; return (0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]) / 255; };
  const grab = async (t) => { await seek(t); ctx.drawImage(v, 0, 0); return ctx.getImageData(0, 0, W, H).data; };

  // Page area, excluding the recorded window chrome.
  const PX0 = Math.round(W * 0.055), PX1 = Math.round(W * 0.945);
  const PY0 = Math.round(H * 0.075), PY1 = Math.round(H * 0.925);
  const PW = PX1 - PX0, PH = PY1 - PY0;
  out.push('page box x[' + PX0 + ',' + PX1 + '] y[' + PY0 + ',' + PY1 + ']');
  out.push('');

  const bigTextRow = Math.round(PY0 + PH * 0.62);

  for (let t = 0.40; t <= 1.06; t += 0.03) {
    const d = await grab(t);
    const row = Math.round(PY0 + PH * 0.34);          // blank in both pages
    const dim = lum(d, PX0 + 10, row);                 // outgoing plateau
    let edge = PX1;
    const thresh = (dim + 0.98) / 2;
    for (let x = PX0 + 4; x < PX1 - 4; x++) {
      if (lum(d, x, row) > thresh && lum(d, x + 3, row) > thresh) { edge = x; break; }
    }
    // leftmost dark pixel of the big type, on each side of the wipe edge
    let outLeft = -1, inLeft = -1;
    for (let x = PX0 + 4; x < edge - 6; x++) { if (lum(d, x, bigTextRow) < dim * 0.55) { outLeft = x; break; } }
    for (let x = edge + 6; x < PX1 - 4; x++) { if (lum(d, x, bigTextRow) < 0.45) { inLeft = x; break; } }
    out.push('H t=' + t.toFixed(2)
      + ' cover=' + ((PX1 - edge) / PW).toFixed(3)
      + ' dim=' + dim.toFixed(3)
      + ' outTextX=' + (outLeft < 0 ? '-' : ((outLeft - PX0) / PW).toFixed(3))
      + ' inTextX=' + (inLeft < 0 ? '-' : ((inLeft - PX0) / PW).toFixed(3)));
  }
  out.push('');

  for (let t = 2.64; t <= 3.24; t += 0.03) {
    const d = await grab(t);
    const col = Math.round(PX0 + PW * 0.10);
    const dim = lum(d, col, PY0 + 10);
    let edge = PY1;
    const thresh = (dim + 0.98) / 2;
    for (let y = PY1 - 4; y > PY0 + 4; y--) {
      if (lum(d, col, y) > thresh && lum(d, col, y - 3) > thresh) { edge = y; } else break;
    }
    out.push('V t=' + t.toFixed(2) + ' cover=' + ((PY1 - edge) / PH).toFixed(3) + ' dim=' + dim.toFixed(3));
  }

  document.getElementById('out').textContent = 'video ' + W + 'x' + H + '\n' + out.join('\n');
  document.title = 'ready';
});
</script>
